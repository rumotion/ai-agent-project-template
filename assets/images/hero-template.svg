<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#10161f"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#f778ba"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="680" rx="18" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>
  <rect width="1280" height="680" rx="18" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="5" rx="2.5" fill="url(#accentBar)"/>

  <!-- Header -->
  <text x="64" y="94" font-size="46" font-weight="800" fill="url(#titleGrad)">AI Agent Project Template</text>
  <text x="64" y="132" font-size="20" fill="#c9d1d9">One canonical instruction file. Many models. ~1.9K-token startup.</text>
  <rect x="1024" y="56" width="192" height="32" rx="16" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="1120" y="77" text-anchor="middle" font-size="13" font-weight="700" fill="#bc8cff">v0.8.0 · Atomic Step-Commit</text>

  <!-- Spokes (behind boxes) -->
  <g stroke="#30363d" stroke-width="2">
    <line x1="264" y1="197" x2="470" y2="240"/>
    <line x1="264" y1="241" x2="470" y2="252"/>
    <line x1="264" y1="285" x2="470" y2="264"/>
    <line x1="264" y1="329" x2="470" y2="276"/>
    <line x1="264" y1="373" x2="470" y2="288"/>
    <line x1="1016" y1="197" x2="810" y2="240"/>
    <line x1="1016" y1="241" x2="810" y2="252"/>
    <line x1="1016" y1="285" x2="810" y2="264"/>
    <line x1="1016" y1="329" x2="810" y2="276"/>
    <line x1="1016" y1="373" x2="810" y2="288"/>
  </g>

