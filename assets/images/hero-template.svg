  <rect x="470" y="205" width="340" height="112" rx="16" fill="#161b22" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="640" y="255" text-anchor="middle" font-size="27" font-weight="800" fill="#f0f6fc">AGENTS.md</text>
  <text x="640" y="284" text-anchor="middle" font-size="16" fill="#8b949e">+ Shared Memory Bank</text>

  <!-- Tool chips -->
  <g font-size="13" fill="#c9d1d9">
    <rect x="64" y="180" width="200" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="164" y="202" text-anchor="middle">Claude</text>
    <rect x="64" y="224" width="200" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="164" y="246" text-anchor="middle">Gemini</text>
    <rect x="64" y="268" width="200" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="164" y="290" text-anchor="middle">Codex / ChatGPT</text>
    <rect x="64" y="312" width="200" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="164" y="334" text-anchor="middle">Cline / Roo Code</text>
    <rect x="64" y="356" width="200" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="164" y="378" text-anchor="middle">Cursor</text>
    <rect x="1016" y="180" width="200" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="1116" y="202" text-anchor="middle">Windsurf</text>
    <rect x="1016" y="224" width="200" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="1116" y="246" text-anchor="middle">Copilot</text>
    <rect x="1016" y="268" width="200" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="1116" y="290" text-anchor="middle">Aider</text>
    <rect x="1016" y="312" width="200" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="1116" y="334" text-anchor="middle">Antigravity</text>
    <rect x="1016" y="356" width="200" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="1116" y="378" text-anchor="middle">VS Code</text>
  </g>

  <!-- Atomic loop strip -->
  <text x="64" y="443" font-size="16" font-weight="700" fill="#bc8cff">New in v0.8.0:</text>
  <g font-size="13" font-weight="700">
    <rect x="240" y="420" width="140" height="40" rx="20" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="310" y="445" text-anchor="middle" fill="#58a6ff">PLAN</text>
    <text x="396" y="445" text-anchor="middle" fill="#8b949e" font-size="16">→</text>
    <rect x="412" y="420" width="140" height="40" rx="20" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="482" y="445" text-anchor="middle" fill="#d29922">EXECUTE</text>
    <text x="568" y="445" text-anchor="middle" fill="#8b949e" font-size="16">→</text>
    <rect x="584" y="420" width="140" height="40" rx="20" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="654" y="445" text-anchor="middle" fill="#3fb950">VERIFY</text>
    <text x="740" y="445" text-anchor="middle" fill="#8b949e" font-size="16">→</text>
    <rect x="756" y="420" width="140" height="40" rx="20" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
    <text x="826" y="445" text-anchor="middle" fill="#bc8cff">COMMIT</text>
    <text x="912" y="445" text-anchor="middle" fill="#8b949e" font-size="16">→</text>
    <rect x="928" y="420" width="140" height="40" rx="20" fill="#161b22" stroke="#76e3ea" stroke-width="1.5"/>
    <text x="998" y="445" text-anchor="middle" fill="#76e3ea">REFLECT</text>
  </g>
  <text x="640" y="482" text-anchor="middle" font-size="13" fill="#8b949e">every checkpoint committed atomically — repeat per plan step</text>

  <!-- Stats bar -->
  <line x1="64" y1="492" x2="1216" y2="492" stroke="#21262d" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="144" y="530" font-size="24" font-weight="800" fill="#58a6ff">~1,886</text>
    <text x="144" y="552" font-size="12" fill="#8b949e">tokens FAST_INIT</text>
    <text x="308" y="530" font-size="24" font-weight="800" fill="#3fb950">4 / 7,545</text>
    <text x="308" y="552" font-size="12" fill="#8b949e">startup files / chars</text>
    <text x="472" y="530" font-size="24" font-weight="800" fill="#d29922">9</text>
    <text x="472" y="552" font-size="12" fill="#8b949e">tool adapters</text>
    <text x="640" y="530" font-size="24" font-weight="800" fill="#bc8cff">14</text>
    <text x="640" y="552" font-size="12" fill="#8b949e">Memory Bank files</text>
    <text x="808" y="530" font-size="24" font-weight="800" fill="#76e3ea">6</text>
    <text x="808" y="552" font-size="12" fill="#8b949e">reusable skills</text>
    <text x="972" y="530" font-size="24" font-weight="800" fill="#f778ba">14</text>
    <text x="972" y="552" font-size="12" fill="#8b949e">workflows</text>
    <text x="1136" y="530" font-size="24" font-weight="800" fill="#ffa657">0</text>
    <text x="1136" y="552" font-size="12" fill="#8b949e">validator deps</text>
  </g>
  <g stroke="#21262d" stroke-width="1.5">
    <line x1="226" y1="510" x2="226" y2="556"/>
    <line x1="390" y1="510" x2="390" y2="556"/>
    <line x1="556" y1="510" x2="556" y2="556"/>
    <line x1="724" y1="510" x2="724" y2="556"/>
    <line x1="890" y1="510" x2="890" y2="556"/>
    <line x1="1054" y1="510" x2="1054" y2="556"/>
  </g>

  <!-- Quick start -->
  <text x="640" y="606" text-anchor="middle" font-size="17" fill="#c9d1d9"><tspan font-weight="800" fill="#3fb950">Quick start:  </tspan>1. Use this template   →   2. run <tspan font-weight="700" fill="#f0f6fc">python scripts/init-fast.py</tspan>   →   3. paste the printed prompt into your agent</text>

  <!-- Footer -->
  <line x1="64" y1="632" x2="1216" y2="632" stroke="#21262d" stroke-width="1.5"/>
