<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent Project Template v1.3.1 - features and release highlights</title>
  <desc id="desc">Canonical instructions, shared project memory and verified workflows. New in v1.3: verifiable context continuity, durable task ledger with parent acceptance, and R1 advisor model routing. Python standard-library tooling and local-only defaults.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111c30"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#273449" stroke-width=".5"/></pattern>
  </defs>
  <rect width="1200" height="760" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="760" rx="24" fill="url(#grid)" opacity=".4"/>
  <rect x="1" y="1" width="1198" height="758" rx="23" fill="none" stroke="#334155"/>
  <rect x="48" y="47" width="4" height="24" rx="2" fill="url(#accent)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="65" y="65" fill="#94a3b8" font-size="14" letter-spacing="2">A FOUNDATION FOR AI CODING PROJECTS</text>
    <rect x="1020" y="42" width="132" height="34" rx="17" fill="#18263d" stroke="#475569"/>
    <text x="1086" y="64" text-anchor="middle" fill="#c4b5fd" font-size="14">RELEASE 1.3.1</text>
    <text x="48" y="144" fill="#f8fafc" font-size="52" font-weight="700" letter-spacing="-1.5">AI Agent Project Template</text>
    <text x="50" y="186" fill="#cbd5e1" font-size="22">One instruction source. Shared project memory. Verified steps.</text>
    <text x="50" y="220" fill="#94a3b8" font-size="16">For Claude, Codex and Gemini / Antigravity. Python standard-library tools.</text>
    <g transform="translate(48,268)">
      <rect width="350" height="154" rx="14" fill="#101d31" stroke="#334155"/>
      <rect x="24" y="24" width="34" height="34" rx="8" fill="#1e3a5f"/>
      <text x="41" y="47" text-anchor="middle" fill="#93c5fd" font-size="17" font-weight="700">01</text>
      <text x="74" y="47" fill="#f1f5f9" font-size="20" font-weight="600">Canonical instructions</text>
      <text x="24" y="88" fill="#93c5fd" font-family="Consolas, monospace" font-size="17">AGENTS.md</text>
      <text x="24" y="121" fill="#94a3b8" font-size="15">Compact startup path. Thin discovery adapters.</text>
    </g>
    <g transform="translate(425,268)">
      <rect width="350" height="154" rx="14" fill="#101d31" stroke="#334155"/>
      <rect x="24" y="24" width="34" height="34" rx="8" fill="#33275a"/>
      <text x="41" y="47" text-anchor="middle" fill="#c4b5fd" font-size="17" font-weight="700">02</text>
      <text x="74" y="47" fill="#f1f5f9" font-size="20" font-weight="600">Shared project memory</text>
      <text x="24" y="88" fill="#c4b5fd" font-family="Consolas, monospace" font-size="17">memory-bank/</text>
      <text x="24" y="121" fill="#94a3b8" font-size="15">Typed records. Verifiable cross-model handoff.</text>
    </g>
    <g transform="translate(802,268)">
      <rect width="350" height="154" rx="14" fill="#101d31" stroke="#334155"/>
      <rect x="24" y="24" width="34" height="34" rx="8" fill="#163e3e"/>
      <text x="41" y="47" text-anchor="middle" fill="#5eead4" font-size="17" font-weight="700">03</text>
      <text x="74" y="47" fill="#f1f5f9" font-size="20" font-weight="600">Verified workflows</text>
      <text x="24" y="88" fill="#5eead4" font-family="Consolas, monospace" font-size="17">scripts/check-template.py</text>
      <text x="24" y="121" fill="#94a3b8" font-size="15">193-file gate. Regressions. Mirror checks.</text>
    </g>
    <text x="48" y="463" fill="#5eead4" font-size="12" font-weight="700" letter-spacing="2">NEW IN 1.3</text>
    <path d="M162 459H1152" stroke="#31726f"/>
    <g transform="translate(48,484)" data-card="continuity">
      <rect width="350" height="168" rx="14" fill="#102c36" stroke="#3b8f88"/>
      <text x="24" y="36" fill="#f0fdfa" font-size="20" font-weight="600">Verifiable continuity</text>
      <text x="24" y="72" fill="#bbd5dc" font-size="15">Private checkpoints and resume doctor.</text>
      <text x="24" y="100" fill="#bbd5dc" font-size="15">1,000-record archive within budget cap.</text>
      <text x="24" y="137" fill="#99f6e4" font-size="14" font-weight="600">STRICT INTEGRITY / NO SILENT LOSS</text>
    </g>
    <g transform="translate(425,484)" data-card="tasks">
      <rect width="350" height="168" rx="14" fill="#102c36" stroke="#3b8f88"/>
      <text x="24" y="36" fill="#f0fdfa" font-size="20" font-weight="600">Durable task ledger</text>
      <text x="24" y="72" fill="#bbd5dc" font-size="15">Track attempts, revisions and scopes.</text>
      <text x="24" y="100" fill="#bbd5dc" font-size="15">Separate worker submission &amp; acceptance.</text>
      <text x="24" y="137" fill="#99f6e4" font-size="14" font-weight="600">DEPENDENCY GATES / PACING OFF</text>
    </g>
    <g transform="translate(802,484)" data-card="routing">
      <rect width="350" height="168" rx="14" fill="#102c36" stroke="#3b8f88"/>
      <text x="24" y="36" fill="#f0fdfa" font-size="20" font-weight="600">Advisor model routing</text>
      <text x="24" y="72" fill="#bbd5dc" font-size="15">Fast writer plus read-only senior critic.</text>
      <text x="24" y="100" fill="#bbd5dc" font-size="15">Receipts bind revision, artifact &amp; error.</text>
      <text x="24" y="137" fill="#99f6e4" font-size="14" font-weight="600">STDLIB POLICY / NATIVE HOOK REPAIRS</text>
    </g>
    <path d="M48 687H1152" stroke="#334155"/>
    <text x="48" y="717" fill="#94a3b8" font-size="13">PYTHON 3.9+ / NO BASE DEPENDENCY INSTALLS / MIT LICENSE</text>
    <text x="1152" y="717" text-anchor="end" fill="#94a3b8" font-size="13">rumotion / ai-agent-project-template</text>
    <text x="48" y="741" fill="#7f96b5" font-size="12">Local-only defaults and advisory guards. Native client integrations require verification.</text>
  </g>
</svg>
